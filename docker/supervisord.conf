[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The scheduler, which on shared hosting was a single cron line.
;
; More rides on this than the name suggests. routes/console.php uses it to write a
; heartbeat every minute, and QueueHealthHelper reads that heartbeat to decide
; whether the app may dispatch work to a queue at all — with no heartbeat it
; assumes nothing will ever drain the queue and changes behaviour accordingly. It
; also drains the queue itself, expires lapsed subscriptions daily, and reconciles
; payment orders whose callback never arrived.
;
; schedule:work rather than a cron daemon: it is the same scheduler, running in the
; foreground where supervisor can see it die and restart it.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0