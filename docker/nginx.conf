user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs go to the container's streams so `docker logs` and Coolify can see them.
    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # A family uploading a video of the funeral service is the largest thing this
    # app accepts: MemorialMediaController caps video at 100MB, and PHP's own
    # default of 2M would reject it long before that check ever ran. Kept in step
    # with upload_max_filesize in docker/php.ini — changing one alone just moves
    # which layer rejects the upload.
    client_max_body_size 128M;

    # Video is served straight off disk through this proxy; the default 60s
    # send_timeout cuts a slow mobile connection off mid-file.
    client_body_timeout 300s;
    send_timeout        300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Temp paths under /tmp: the filesystem is read-only to www-data everywhere else.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Everything that is not a real file goes to Laravel, which is what makes
        # /{memorial-slug} and /r/{reseller}/{slug} resolve.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Hashed filenames, so these can be cached hard and indefinitely.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # public/storage is a symlink to storage/app/public — the families' photos
        # and videos. Cached, but not immutable: a caption edit or a re-upload can
        # replace a file at the same path.
        location /storage/ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;

            # Generating a PDF report or transcoding nothing but a large upload can
            # outlast the default 60s.
            fastcgi_read_timeout 300s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Dotfiles are not ours to serve — .env above all.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}