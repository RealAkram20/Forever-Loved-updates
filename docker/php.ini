; Kept in step with client_max_body_size in docker/nginx.conf. The app accepts
; video up to 100MB (MemorialMediaController::MAX_VIDEO_SIZE) and up to ten files
; per story, so post_max_size has to clear the largest single request rather than
; the largest single file.
upload_max_filesize = 128M
post_max_size = 128M
max_file_uploads = 20

; A PDF memorial report renders every photo on the page; 128M is not enough.
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

date.timezone = UTC

; Errors belong in the log, never in the response. APP_DEBUG governs what Laravel
; itself shows; this governs what PHP would print underneath it.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The filesystem is immutable between deploys, so there is nothing to revalidate.
opcache.validate_timestamps = 0
opcache.save_comments = 1