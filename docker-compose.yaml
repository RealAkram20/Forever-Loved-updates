# Forever Loved — the production stack.
#
# Deployed through Coolify's Docker Compose build pack. Coolify supplies the
# environment, terminates TLS at its own proxy and routes to `app` on 8080, so
# nothing here publishes a host port: two things binding 443 would just fight.
#
# The database lives here rather than as a separately-clicked Coolify resource so
# that the stack is described in one versioned file. What is running can be read
# from the repository instead of reconstructed from a dashboard, and a rebuild is a
# deploy rather than an afternoon of remembering which boxes were ticked.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # The entrypoint runs migrations, and a migration against a database still
    # doing its first-boot initialisation fails in a way that looks like a broken
    # deploy. service_healthy makes the app wait for MariaDB to actually answer
    # rather than merely to have been started.
    depends_on:
      mariadb:
        condition: service_healthy

    # List form rather than a map, because Coolify's magic variables are recognised
    # as bare keys — a map would force an empty value onto them and they would never
    # be substituted.
    environment:
      # Declares that this service, on this port, is what a domain routes to.
      # Coolify fills it in and points its proxy here; nothing else needs to know
      # the port.
      - SERVICE_FQDN_APP_8080

      - APP_NAME=${APP_NAME:-Forever Loved}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}

      # Deliberately not generated. APP_KEY has to match the key the live site is
      # already using or every encrypted value in the imported database becomes
      # unreadable, and Coolify's SERVICE_BASE64_* is — by its own source comment —
      # "not base64, it's just a random string", which Laravel would reject anyway.
      - APP_KEY=${APP_KEY}

      # Also explicit. This one decides far more than it looks: URL generation, the
      # canonical tags, and which base domain resellers are minted under.
      - APP_URL=${APP_URL}

      # Container convention: logs belong on the process's own streams, where
      # `docker logs` and Coolify can read them, not in a file inside the container
      # that nobody will ever open.
      - LOG_CHANNEL=${LOG_CHANNEL:-stderr}
      - LOG_LEVEL=${LOG_LEVEL:-error}

      # The service name is the hostname on the compose network. The password is
      # generated and stored by Coolify — the same reference in both services
      # resolves to the same secret, so they cannot drift apart.
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-forever}
      - DB_USERNAME=${DB_USERNAME:-forever}
      - DB_PASSWORD=${SERVICE_PASSWORD_64_MARIADB}

      # All three have tables of their own in this app, so none of them need Redis
      # and none of them lose state when a container is replaced. File-based
      # sessions would sign every visitor out on each deploy.
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      # Eight hours, not the framework's two: admins run support sessions and
      # families keep a memorial open in a tab all day; a session that dies at
      # lunch reads as the site logging people out at random.
      - SESSION_LIFETIME=${SESSION_LIFETIME:-480}
      - CACHE_STORE=${CACHE_STORE:-database}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - FILESYSTEM_DISK=local

      # Defaults to the log driver, so a misconfigured mailer writes to the log
      # rather than silently dropping a family's invitation.
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_SCHEME=${MAIL_SCHEME:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${APP_NAME:-Forever Loved}

      # Left unset, this derives from APP_URL and the app begins minting
      # acme.alwaysforeverloved.com for resellers — addresses that resolve nowhere
      # until a wildcard record and a wildcard certificate exist. See
      # Reseller::subdomainRoutingAvailable().
      - RESELLER_APP_DOMAIN=${RESELLER_APP_DOMAIN:-}

      # Where the scheduler writes Traefik router files for verified reseller custom
      # domains — the container path of the bind mount below. The proxy's file
      # provider watches the host side and picks changes up without a restart.
      - PROXY_CUSTOM_DOMAINS_DIR=/var/www/html/storage/proxy-domains

    # Reseller subdomains: one router per direction, matching every {slug} under the
    # base domain. Coolify's own generated labels handle the apex; these add the
    # wildcard alongside them. No traefik.http.services.* is declared on purpose —
    # Coolify doesn't declare one either, so every router (theirs and ours) rides the
    # container's single implicit service on the exposed port; declaring one here
    # would silently re-point Coolify's routers at it.
    #
    # The https router asks the `letsencrypt-dns` resolver (configured on the Coolify
    # proxy, DNS-01 via Hostinger) for one certificate covering apex + wildcard.
    # Until that resolver exists on the proxy, subdomains serve Traefik's default
    # certificate — the apex keeps its own HTTP-01 certificate and is unaffected.
    #
    # The domain is written out literally: Traefik label rules take literal strings,
    # and this file is the description of this deployment, which owns this domain.
    # ($$ is a compose-escaped $ — the regex anchors, not variables.)
    labels:
      - traefik.enable=true
      - traefik.http.routers.wildcard-forever-http.entryPoints=http
      - traefik.http.routers.wildcard-forever-http.rule=HostRegexp(`^[a-z0-9-]+\.alwaysforeverloved\.com$$`)
      - traefik.http.routers.wildcard-forever-http.middlewares=redirect-to-https
      - traefik.http.routers.wildcard-forever-https.entryPoints=https
      - traefik.http.routers.wildcard-forever-https.rule=HostRegexp(`^[a-z0-9-]+\.alwaysforeverloved\.com$$`)
      - traefik.http.routers.wildcard-forever-https.middlewares=gzip
      - traefik.http.routers.wildcard-forever-https.tls=true
      - traefik.http.routers.wildcard-forever-https.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.wildcard-forever-https.tls.domains[0].main=alwaysforeverloved.com
      - traefik.http.routers.wildcard-forever-https.tls.domains[0].sans=*.alwaysforeverloved.com

    volumes:
      # Everything families upload. The single most important line in this file:
      # without it, every photo and video is written into the container's own
      # layer and destroyed by the next deploy.
      - forever-storage:/var/www/html/storage

      # The proxy's watched config folder, nested inside the storage mount (the more
      # specific path wins). The scheduler writes one custom-domain-*.yaml router
      # file here per verified reseller custom domain; Traefik routes the domain and
      # orders its certificate the moment the file lands. The whole dynamic dir, not
      # a subfolder: Traefik's file provider does not descend into subdirectories.
      # The sync only ever creates or deletes its own custom-domain-* files, and the
      # entrypoint's chown makes the mount writable for www-data, which is exactly
      # what the scheduler runs as.
      - /data/coolify/proxy/dynamic:/var/www/html/storage/proxy-domains

    # expose, not ports. Reachable from Coolify's proxy on the shared network,
    # not from the open internet on a host port that bypasses TLS.
    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped

    # Both passwords are generated and kept by Coolify, so no secret is typed into a
    # form, pasted into a chat window, or committed here by accident. symbols: false
    # in Coolify's generator is a quiet convenience — a password with shell
    # metacharacters in it is a bad afternoon with a MySQL client.
    environment:
      - MARIADB_DATABASE=${DB_DATABASE:-forever}
      - MARIADB_USER=${DB_USERNAME:-forever}
      - MARIADB_PASSWORD=${SERVICE_PASSWORD_64_MARIADB}
      - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_64_MARIADBROOT}

    # utf8mb4 throughout: memorials carry names, tributes and stories in every
    # script there is, and emoji. Anything narrower silently mangles them.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # A story with photographs is a large row; the default 16M rejects it.
      - --max-allowed-packet=64M

    volumes:
      - forever-db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

volumes:
  # Named, so `docker compose down` and every redeploy leave them alone. These two
  # hold the only things here that cannot be rebuilt from the repository.
  forever-storage:
  forever-db:
